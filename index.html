<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Week 5 Assignment: Event Guest Book</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        button:hover {
            background: #218838;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .guest-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .guest-list li {
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-list li:last-child {
            border-bottom: none;
        }

        .counter-badge {
            background: #007bff;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .error-text {
            color: #d93025;
            font-weight: 600;
        }

        .quote-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        #quoteText {
            font-size: 1.2rem;
            line-height: 1.5;
            margin: 0.5rem 0;
        }

        #quoteAuthor {
            font-weight: 700;
            margin-top: 0.75rem;
        }

        #statusMessage {
            min-height: 1.5em;
            margin: 0.75rem 0;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>VIP Event Guest Book</h2>
        <p>Type a name below to welcome them to the exclusive attendee list.</p>

        <label for="guestName">Guest Name:</label>
        <div class="form-group">
            <input type="text" id="guestName" placeholder="Enter full name...">
            <button id="addBtn">Add</button>
        </div>

        <div class="stats-bar">
            <span>Total Attending:</span>
            <span id="totalCounter" class="counter-badge">0</span>
        </div>

        <!-- Target container for dynamic rendering -->
        <ul id="guestListDisplay" class="guest-list">
            <!-- Dynamic <li> elements will be injected here -->
        </ul>
    </div>

    <div class="quote-card">
        <h2>Random Quote</h2>
        <p id="quoteText">Quote will appear here.</p>
        <p id="quoteAuthor">Author Name</p>
        <p id="statusMessage" aria-live="polite"></p>
        <button id="fetchBtn" type="button">Get New Quote</button>
    </div>

    <script>
        // Global array for guest book data
        let guestArray = [];

        const guestNameInput = document.getElementById("guestName");
        const addBtn = document.getElementById("addBtn");
        const totalCounter = document.getElementById("totalCounter");
        const guestListDisplay = document.getElementById("guestListDisplay");

        function renderGuestList() {
            guestListDisplay.innerHTML = "";

            guestArray.forEach((guestName) => {
                const listItem = document.createElement("li");
                const guestLabel = document.createElement("span");
                const guestBadge = document.createElement("span");

                guestLabel.textContent = guestName;
                guestBadge.textContent = "Guest";
                guestBadge.className = "counter-badge";

                listItem.appendChild(guestLabel);
                listItem.appendChild(guestBadge);
                guestListDisplay.appendChild(listItem);
            });

            totalCounter.textContent = guestArray.length;
        }

        addBtn.addEventListener("click", function () {
            const guestName = guestNameInput.value.trim();

            if (!guestName) {
                return;
            }

            guestArray.push(guestName);
            guestNameInput.value = "";
            renderGuestList();
        });

        // Target API URL: A free, public random quote engine
        const API_URL = "https://api.allorigins.win/raw?url=https://zenquotes.io/api/random";

        // DOM Elements
        const quoteText = document.getElementById("quoteText");
        const quoteAuthor = document.getElementById("quoteAuthor");
        const fetchBtn = document.getElementById("fetchBtn");
        const statusMessage = document.getElementById("statusMessage");

        async function fetchRandomQuote(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data[0];
            } catch (error) {
                return null;
            }
        }

        fetchBtn.addEventListener("click", async function () {
            fetchBtn.disabled = true;
            fetchBtn.textContent = "Fetching...";

            statusMessage.textContent = "";
            statusMessage.classList.remove("error-text");

            const data = await fetchRandomQuote(API_URL);

            if (data === null) {
                statusMessage.textContent = "Failed to load quote. Check your internet connection.";
                statusMessage.classList.add("error-text");
            } else {
                quoteText.textContent = data.q;
                quoteAuthor.textContent = data.a;
            }

            fetchBtn.disabled = false;
            fetchBtn.textContent = "Get New Quote";
        });
    </script>
</body>

</html>
